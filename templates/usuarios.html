    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styleusuarios.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" id="paginainicial" href="/estoque.html" >Pagina Inicial</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="editaritens" href="/editar.html" >Editar itens</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="novoitem" href="novoitem.html">Novo item</a>
          <img
          id="logo"
          src="static/logod.png"
          alt="Logo Customizado"
          width="180"
          height="140">
        </li>
        
        <li id="CadastroUsuario" class="nav-item" style="position: relative; top: 10px;">
          <a  class="nav-link" id="usuarios" href="usuarios.html">Cadastro de usuários</a>
        </li>

      </ul>

<form action="/usuarios.html" method="POST">
    <div class="card card-cadastro" style="max-width: 500px; margin: 30px auto;">
        <div class="titulo p-3 bg-light border-bottom text-center fw-bold">
            <i class="bi bi-person-plus-fill"></i>
            Cadastro de Usuários
        </div>

        <div class="card-body">
            <div class="mb-4">
                <label class="form-label">Nome de Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="login" class="form-control" placeholder="Digite o nome do usuário" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Digite a senha" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Tipo de Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                    <select name="role" class="form-select" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Visitante">Visitante</option>
                    </select>
                </div>
            </div>

            <hr>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg btn-salvar">
                    <i class="bi bi-floppy-fill"></i> Salvar Usuário
                </button>
                <button type="reset" class="btn btn-secondary btn-lg btn-limpar">
                    <i class="bi bi-eraser-fill"></i> Limpar Campos
                </button>
            </div>
        </div>
    </div>
  </form>
    

</body>
</html>
