<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="static/stylesestoque.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <!-- NAVBAR PRINCIPAL -->

  <nav id="navbarPrincipal" class="navbar navbar-expand-lg navbar-light">

    <button id="botaoMenu"
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuNavbar">

      <span id="iconeMenu" class="navbar-toggler-icon"></span>
    </button>

    <div id="menuNavbar" class="collapse navbar-collapse">

      <ul id="listaNavbar" class="navbar-nav">

        <!-- Página Inicial -->
        <li id="itemPaginaInicial" class="nav-item">

          <a id="linkPaginaInicial"
            class="nav-link active"
            href="#">

            Página Inicial
          </a>

        </li>

        <!-- Editar Itens -->
        <li id="itemEditarItens" class="nav-item">

          <a id="linkEditarItens"
            class="nav-link"
            href="/editar.html">

            Editar Itens
          </a>

        </li>

        <!-- Novo Item -->
        <li id="itemNovoItem" class="nav-item">

          <a id="linkNovoItem"
            class="nav-link"
            href="/novoitem.html">

            Novo Item
          </a>

          
        </li>
        <li id="CadastroUsuario" class="nav-item">
          <a  class="nav-link" id="usuarios" href="usuarios.html">Cadastro de usuários</a>
        </li>

          </div>
        </li>

      </ul>
    </div>
  </nav>

    <!-- NAVBAR INFERIOR -->

  <nav class="navbar bg-body-tertiary">

    <div class="container">

      <a class="navbar-brand" href="#">

        <img
          id="logo"
          src="static/logod.png"
          alt="Logo Customizado"
          width="180"
          height="140">

      </a>
    </div>

  <!-- TABELA -->

  <table id="tabela" class="table">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Descrição</th>
        <th scope="col">Quantidade</th>
        <th scope="col">Preço</th>
        <th scope="col">Categoria</th>
        <th scope="col">Foto</th>
        
      </tr> 

      {% for item in resultado %}
      <tr>
        <td scope="col">{{item[0]}}</td>
        <td scope="col">{{item[1]}}</td>
        <td scope="col">{{item[3]}}</td>
        <td scope="col">{{item[2]}}</td>
        <td scope="col">{{item[4]}}</td>
        <td scope="col">{{item[7]}}</td>
        <td scope="col"><button type="button" class="btn btn-primary" onclick="mostrar_foto('{{item[6]}}')">Foto</button></td>
      </tr>
      {%endfor%}

  </table>

  <script>
    function mostrar_foto(argumento){
      Swal.fire({
      imageUrl: argumento,
      });
    }
  </script>
</body>
</html>
