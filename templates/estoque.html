<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Sistema Fiep</title>

</head>

<body>

  <!-- NAVBAR PRINCIPAL -->

  <nav id="navbarPrincipal" class="navbar navbar-expand-lg navbar-light">

    <button id="botaoMenu"
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuNavbar">

      <span id="iconeMenu" class="navbar-toggler-icon"></span>
    </button>

    <div id="menuNavbar" class="collapse navbar-collapse">

      <ul id="listaNavbar" class="navbar-nav">

        <!-- Página Inicial -->
        <li id="itemPaginaInicial" class="nav-item">

          <a id="linkPaginaInicial"
            class="nav-link active"
            href="#">

            Página Inicial
          </a>

        </li>

        <!-- Editar Itens -->
        <li id="itemEditarItens" class="nav-item">

          <a id="linkEditarItens"
            class="nav-link"
            href="#">

            Editar Itens
          </a>

        </li>

        <!-- Novo Item -->
        <li id="itemNovoItem" class="nav-item">

          <a id="linkNovoItem"
            class="nav-link"
            href="#">

            Novo Item
          </a>

        </li>


          </div>
        </li>

      </ul>
    </div>
  </nav>

  <!-- TABELA -->

  <table id="tabela" class="table">

    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Função</th>
        <th scope="col">Quantidade</th>
      </tr>
    </thead>

    <tbody>

      <tr>
        <th scope="row">190609</th>
        <td>Alicate</td>
        <td>Apertar coisas</td>
        <td>30</td>
      </tr>

      <tr>
        <th scope="row">100109</th>
        <td>Parafusadeira</td>
        <td>Parafusar</td>
        <td>5</td>
      </tr>

      <tr>
        <th scope="row">090708</th>
        <td>Prego</td>
        <td>Pregar</td>
        <td>500</td>
      </tr>

    </tbody>
  </table>

  <!-- NAVBAR INFERIOR -->

  <nav class="navbar bg-body-tertiary">

    <div class="container">

      <a class="navbar-brand" href="#">

        <img
          id="logo"
          src="static/logonova.png"
          alt="Logo Customizado"
          width="180"
          height="140">

      </a>
    </div>

    <!-- PESQUISA -->

    <form id="Pesquisa" class="d-flex" role="search">

      <input
        class="form-control me-2"
        type="search"
        placeholder="Pesquisar"
        aria-label="Pesquisar">

      <button
        id="Pesquisar"
        class="btn"
        type="submit">

        Pesquisar
      </button>

    </form>

  </nav>

  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
