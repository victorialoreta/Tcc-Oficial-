<div id="caixaNovoItem">

    <h2 id="tituloNovoItem">Novo Item</h2>

<form action="/incluir_novo", method="POST">

    <div id="linhaCampos1">

        <div class="grupoCampo">
            <label>Nome</label>
            <input type="text" id="campoNome" name="nome">
        </div>

            <label>Descrição</label>

        </div>

    </div>

    <div id="linhaCampos2">

        <div class="grupoCampo">
            <label>Quantidade</label>
            <input type="number" id="campoQuantidade" name = 'qtde'>
        </div>

        <div class="grupoCampo">
            <label>Categoria</label>
            <input type="text" id="campoCategoria" name="categoria">
        </div>

        <div class="grupoCampo">
            <label>Preço</label>
              <div class="input-group">
        <span class="input-group-text">R$</span>
        <input type="number" id="campoPreco" class="form-control" step="0.01" min="0" name="preco">
    </div>
</div>

        <div class="grupoCampo">
            <label>Foto</label>
            <input type="text" id="campoFoto" name="foto">
        </div>

        <button id="botaoSalvar" type="submit">
